<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>万舟率ランキング</title>
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --ink:#1c1b19; --muted:#6f6a62; --line:#e4dfd5;
  --accent:#0f5c63; --chip:#efebe3;
  --l-gekiare:#c2361f; --l-are:#e07a1f; --l-futsu:#8a857b; --l-katai:#2f6fb0; --l-teppan:#1d3c78;
  --bar:#0f5c63; --good:#1f7a4a; --bad:#b0372a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171a; --panel:#1e2125; --ink:#ecebe7; --muted:#a29d94; --line:#30343a;
    --accent:#5fb7bd; --chip:#2a2e33; --bar:#5fb7bd; --good:#5cc08a; --bad:#e3786b;
    --l-gekiare:#ff6b52; --l-are:#ffa257; --l-futsu:#a8a399; --l-katai:#6ea8e6; --l-teppan:#8fa6e0;
  }
}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1e2125; --ink:#ecebe7; --muted:#a29d94; --line:#30343a;
  --accent:#5fb7bd; --chip:#2a2e33; --bar:#5fb7bd; --good:#5cc08a; --bad:#e3786b;
  --l-gekiare:#ff6b52; --l-are:#ffa257; --l-futsu:#a8a399; --l-katai:#6ea8e6; --l-teppan:#8fa6e0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55;font-size:15px}
.wrap{max-width:880px;margin:0 auto;padding:0 16px 48px}
header{padding:20px 0 8px}
h1{font-size:22px;margin:0;letter-spacing:.02em}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);margin:12px 0}
nav{display:flex;gap:6px;overflow-x:auto;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1 1 0;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 4px;font-size:12px;cursor:pointer}
nav button.on{background:var(--accent);border-color:var(--accent);color:#fff}
section{display:none}
section.on{display:block}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.race{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;cursor:pointer}
.rank{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rname{font-weight:600}
.rmeta{color:var(--muted);font-size:12px}
.pct{text-align:right;font-variant-numeric:tabular-nums}
.pct b{font-size:19px}
.pct small{display:block;color:var(--muted);font-size:11px}
.barw{grid-column:2 / 4;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar{height:100%;background:var(--bar)}
.label{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;color:#fff;margin-left:6px;vertical-align:1px}
.激荒れ{background:var(--l-gekiare)} .荒れ{background:var(--l-are)} .普通{background:var(--l-futsu)} .堅い{background:var(--l-katai)} .鉄板{background:var(--l-teppan)}
.detail{display:none;grid-column:1 / 4;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px}
.race.open .detail{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{background:var(--chip);border-radius:6px;padding:2px 8px;font-size:13px;font-variant-numeric:tabular-nums}
.chip.hit{background:var(--good);color:#fff}
.small{font-size:12px;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.seg button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer}
.seg button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.cond{display:grid;grid-template-columns:1fr auto;gap:2px 10px}
.cond .t{font-weight:600}
.cond .v{text-align:right;font-variant-numeric:tabular-nums}
.stars{color:var(--l-are);letter-spacing:1px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.tablewrap{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.kpi{background:var(--chip);border-radius:10px;padding:8px 10px}
.kpi .n{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .k{font-size:12px;color:var(--muted)}
.good{color:var(--good)} .bad{color:var(--bad)}
h2{font-size:17px;margin:18px 0 6px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
</style>
</head>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const pct = (x, d=1) => x == null ? '—' : (x*100).toFixed(d) + '%';
const yen = x => x == null ? '—' : x.toLocaleString('ja-JP') + '円';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars = n => '★'.repeat(n) + '☆'.repeat(3-n);

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === b.dataset.tab));
});

const [ds, de] = D.data_range;
document.getElementById('sub').textContent =
  `データ ${ds}〜${de} ／ 確認期間 ${D.periods.morning.test[0]}〜${D.periods.morning.test[1]}` +
  (D.today.generated_at ? ` ／ 更新 ${D.today.generated_at.replace('T',' ')}` : '');

function renderToday(){
  const el = document.getElementById('today');
  const t = D.today;
  if (!t.races || !t.races.length){ el.innerHTML = '<div class="empty">今日のレースはまだ計算されていません</div>'; return; }
  const max = Math.max(...t.races.map(r => r.chokuzen_p ?? r.morning_p ?? 0), 0.01);
  el.innerHTML = `<div class="small">${esc(t.date)} の全${t.races.length}レース。平均の万舟率は${pct(t.base)}。タップで買い目と当てはまる条件。</div>` +
  t.races.map((r, i) => {
    const p = r.chokuzen_p ?? r.morning_p;
    const win = new Set(String(r.tri_combo || '').split(';'));
    const bets = (r.bets||[]).map(b => `<span class="chip ${win.has(b)?'hit':''}">${b}</span>`).join('') || '<span class="small">この%では買わない設定です</span>';
    const m = r.matched || {};
    const cond = ['荒れ','堅い'].map(k => (m[k]||[]).map(c => `<div class="small">${k==='荒れ'?'▲':'▼'} ${esc(c.conditions)}(後半${pct(c.rate_test)}・${stars(c.stars)})</div>`).join('')).join('');
    const res = r.tri_pay != null ? `<div class="small">結果 ${esc(r.tri_combo)} ${yen(r.tri_pay)}${r.hit===1?' <b class="good">的中</b>':''}</div>` : '';
    return `<div class="card race" onclick="this.classList.toggle('open')">
      <div class="rank">${i+1}</div>
      <div><span class="rname">${esc(r.venue)} ${r.rno}R</span><span class="label ${esc(r.label)}">${esc(r.label)}</span>
        <div class="rmeta">締切 ${esc(r.deadline)}・${esc(r.race_name||'')}</div></div>
      <div class="pct"><b>${pct(p)}</b><small>朝 ${pct(r.morning_p)}${r.chokuzen_p!=null?` → 直前 ${pct(r.chokuzen_p)}`:''}</small></div>
      <div class="barw"><div class="bar" style="width:${(p/max*100).toFixed(1)}%"></div></div>
      <div class="detail"><div class="small">${r.bet_variant==='chokuzen'?'直前版':'朝版'}の買い目(${(r.bets||[]).length}点)</div><div class="chips">${bets}</div>${cond}${res}</div>
    </div>`;
  }).join('');
}

let condDir = '荒れ', condTag = 'すべて';
function renderCond(){
  const el = document.getElementById('cond');
  const rows = [...(D.conditions.pre||[]), ...(D.conditions.chokuzen||[])];
  const tags = ['すべて','外形','メンバー','オカルト','気象・参考','直前'];
  const sum = D.conditions.summary || {};
  const noRepro = [];
  for (const fam of Object.values(sum)) for (const [tag, v] of Object.entries(fam.placebo||{})) if (!v.reproduced) noRepro.push(tag);
  const list = rows.filter(r => r.direction === condDir && (condTag === 'すべて' || r.kind_tags.includes(condTag)));
  el.innerHTML = `
    <div class="seg">${['荒れ','堅い'].map(d => `<button class="${d===condDir?'on':''}" onclick="condDir='${d}';renderCond()">${d==='荒れ'?'荒れやすい順':'堅い順'}</button>`).join('')}</div>
    <div class="seg">${tags.map(t => `<button class="${t===condTag?'on':''}" onclick="condTag='${t}';renderCond()">${t}</button>`).join('')}</div>
    <div class="small">前半(${D.periods.morning.train[0]}〜${D.periods.morning.tune[1]})で選び、後半(${D.periods.morning.test[0]}〜)でも有意だった条件だけを掲載。「気象・参考」は結果時点の値で、朝の%には使っていません。
    ${noRepro.length ? `<br>プラセボ(ラベルをランダムに入れ替えた検証)と比べて再現が確認できなかった種類: <b>${[...new Set(noRepro)].join('・')}</b>(参考程度に)` : ''}</div>
    ${list.length ? list.map((r, i) => `<div class="card cond">
      <div class="t">${i+1}. ${esc(r.conditions)}</div><div class="v"><b>${pct(r.rate_test)}</b></div>
      <div class="small">${esc(r.kind_tags)}・後半${r.n_test.toLocaleString()}R・平均配当${yen(Math.round(r.avg_tri_pay_test))}</div>
      <div class="v small"><span class="stars">${stars(r.stars)}</span> ×${r.lift_test.toFixed(2)}</div>
    </div>`).join('') : '<div class="empty">該当する条件はありません</div>'}`;
}

function modelBlock(name, v){
  if (!v || !v.race_model) return `<h2>${name}</h2><div class="empty">まだ検証していません</div>`;
  const rm = v.race_model, key = rm.version, e = rm[key];
  const bl = [['勝率だけのロジスティック回帰', rm.baseline_logit_nat_win], ['条件表だけの%', rm.baseline_conditions]]
    .concat(key==='chokuzen' && rm.morning ? [['朝版の%(同じ期間)', rm.morning]] : []).filter(x => x[1]);
  const b = v.bets;
  return `<h2>${name}</h2>
  <div class="kpis">
    <div class="kpi"><div class="n">${e.auc.toFixed(3)}</div><div class="k">見分ける力 AUC(0.5=当てずっぽう)</div></div>
    <div class="kpi"><div class="n">×${e.top10_lift.toFixed(2)}</div><div class="k">上位10%の万舟率 ${pct(e.top10_rate)}(平均${pct(e.base)})</div></div>
    ${b ? `<div class="kpi"><div class="n ${b.roi>=1?'good':'bad'}">${pct(b.roi,1)}</div><div class="k">買い目の回収率(${b.races.toLocaleString()}R・的中${pct(b.hit_rate)})</div></div>
    <div class="kpi"><div class="n">${pct(b.placebo_rank_pct,0)}</div><div class="k">ランダム買い100回のうち本物以上だった割合(平均${pct(b.placebo_mean)})</div></div>` : ''}
  </div>
  <div class="tablewrap"><table><tr><th>比較</th><th>AUC</th><th>上位10%</th><th>Brier</th></tr>
    <tr><td><b>このモデル</b></td><td>${e.auc.toFixed(3)}</td><td>${pct(e.top10_rate)}</td><td>${e.brier.toFixed(4)}</td></tr>
    ${bl.map(([n, x]) => `<tr><td>${n}</td><td>${x.auc.toFixed(3)}</td><td>${pct(x.top10_rate)}</td><td>${x.brier.toFixed(4)}</td></tr>`).join('')}
  </table></div>
  <div class="small" style="margin-top:8px">%の当たり具合(確認期間${e.n.toLocaleString()}Rを10段階に分けたもの)</div>
  <div class="tablewrap"><table><tr><th>段階</th><th>出した%</th><th>実際の万舟率</th><th>レース数</th></tr>
    ${e.calibration.map((c, i) => `<tr><td>${i+1}</td><td>${pct(c[0])}</td><td>${pct(c[1])}</td><td>${c[2].toLocaleString()}</td></tr>`).join('')}
  </table></div>
  ${b ? `<div class="small">買い方: ${b.params.n}点・人気目安の上位${b.params.k}点を除外・万舟率${pct(b.params.p_min)}以上のレースのみ。何も考えず買った場合の期待回収率は約75%。最大連敗${b.max_losing_streak}。</div>` : ''}`;
}

function renderValid(){
  const v = D.validation;
  document.getElementById('valid').innerHTML =
    `<div class="small">確認期間 ${D.periods.morning.test[0]}〜${D.periods.morning.test[1]} の成績(この期間は学習にも設定選びにも使っていません)。</div>` +
    modelBlock('朝版', v.morning) + modelBlock('直前版', v.chokuzen);
}

function renderFwd(){
  const f = D.forward, el = document.getElementById('fwd');
  if (!f.total){ el.innerHTML = '<div class="empty">公開開始後の記録はまだありません</div>'; return; }
  const t = f.total;
  el.innerHTML = `<div class="small">${t.start} から毎日の%と買い目、その結果をすべて記録しています。</div>
  <div class="kpis">
    <div class="kpi"><div class="n ${t.roi>=1?'good':'bad'}">${pct(t.roi)}</div><div class="k">回収率(${t.bought.toLocaleString()}R購入・${t.hits}的中)</div></div>
    <div class="kpi"><div class="n">${pct(t.pred_manshu)} / ${pct(t.actual_manshu)}</div><div class="k">予想した万舟率 / 実際</div></div>
    <div class="kpi"><div class="n">${yen(t.payout - t.cost)}</div><div class="k">収支(100円ずつ)</div></div>
  </div>
  <div class="tablewrap"><table><tr><th>日付</th><th>購入</th><th>的中</th><th>回収率</th><th>予想/実際の万舟率</th></tr>
  ${f.days.map(d => d.status === '未計測' ? `<tr><td>${d.date}</td><td colspan="4" class="small">未計測(Mac停止など)</td></tr>` :
    `<tr><td>${d.date}</td><td>${d.bought}</td><td>${d.hits}</td><td>${d.cost ? pct(d.payout/d.cost) : '—'}</td><td>${pct(d.pred_manshu)} / ${pct(d.actual_manshu)}</td></tr>`).join('')}
  </table></div>`;
}

renderToday(); renderCond(); renderValid(); renderFwd();
</script>
</body>
</html>
